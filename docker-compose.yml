# ============================================
# Docker Compose - Product Purchasing System
# ============================================
#
# Uso:
#   Arrancar:  docker compose up -d
#   Detener:   docker compose down
#   Ver logs:  docker compose logs -f mysql
#
# Requiere el archivo .env.docker en la raíz del proyecto.
# Copia .env.example.docker como .env.docker y completa los valores.
#

services:
  mysql:
    image: mysql:8.0
    container_name: pps-mysql
    env_file:
      - .env.docker
    ports:
      - "3307:3306"
    volumes:
      - pps-mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pps-mysql-data:
    external: true


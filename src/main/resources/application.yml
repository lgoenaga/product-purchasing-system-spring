server:
  port: ${SERVER_PORT:8080}
spring:
  application:
    name: product-purchasing-system
  datasource:
    url: jdbc:mysql://${DB_HOST:}:${DB_PORT:}/${DB_NAME:pps_db}?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: ${DB_USER:}
    password: ${DB_PASSWORD:}
    driver-class-name: com.mysql.cj.jdbc.Driver
    hikari:
      maximum-pool-size: ${DB_POOL_SIZE:10}
  jpa:
    hibernate:
      ddl-auto: ${DB_DDL_AUTO:none}
    open-in-view: false
    show-sql: ${DB_SHOW_SQL:true}
    properties:
      hibernate:
        format_sql: true
        use_sql_comments: true
  sql:
    init:
      mode: never

app:
  cors:
    # Orígenes permitidos — sobreescribir en .env con CORS_ALLOWED_ORIGINS
    # React + Vite corre por defecto en el puerto 5173
    allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}

logging:
  level:
    co.edu.cesde.pps: ${LOG_LEVEL:DEBUG}
    org.hibernate.SQL: ${LOG_SQL_LEVEL:DEBUG}
    org.hibernate.orm.jdbc.bind: ${LOG_SQL_BIND_LEVEL:TRACE}


# ============================================
# Docker Compose - DESARROLLO LOCAL
# ============================================
#
# Levanta únicamente el contenedor MySQL local.
# La aplicación Spring Boot se ejecuta directamente con Maven.
#
# Uso:
#   Arrancar:  docker compose -f docker-compose.dev.yml up -d
#   Detener:   docker compose -f docker-compose.dev.yml down
#   Ver logs:  docker compose -f docker-compose.dev.yml logs -f mysql
#
# Requiere el archivo .env.dev.docker en la raíz del proyecto.
# Copia .env.docker.example como .env.dev.docker y completa los valores.
#

services:
  mysql:
    image: mysql:8.0
    container_name: pps-mysql
    env_file:
      - .env.dev.docker
    ports:
      - "3307:3306"
    volumes:
      - pps-mysql-data:/var/lib/mysql
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-uroot", "-p${MYSQL_ROOT_PASSWORD}", "--silent"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

volumes:
  pps-mysql-data:
    external: true

